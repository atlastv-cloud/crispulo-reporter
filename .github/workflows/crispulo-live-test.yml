name: Crispulo Live Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: crispulo-live-test
  cancel-in-progress: true

jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3
          python3 -m pip install --upgrade yt-dlp
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Read channel configuration
        id: config
        shell: bash
        run: |
          VIDEO_ID=$(python3 - <<'PY'
          import json
          with open('config/channel.json', encoding='utf-8') as f:
              c=json.load(f)
          print(c['source']['video_id'])
          PY
          )
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "YouTube video ID: $VIDEO_ID"

      - name: Detect LIVE status with yt-dlp
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p test-output
          URL="https://www.youtube.com/watch?v=${{ steps.config.outputs.video_id }}"

          # First attempt: normal YouTube extraction.
          yt-dlp --no-warnings --dump-single-json --skip-download "$URL" > test-output/metadata.json 2> test-output/yt-dlp.log
          RC=$?

          # Second attempt: use a different YouTube player client if the first
          # attempt failed. This helps distinguish a temporary extractor issue
          # from a genuinely offline source.
          if [ "$RC" -ne 0 ] || ! python3 -m json.tool test-output/metadata.json >/dev/null 2>&1; then
            echo "Primary yt-dlp metadata attempt failed; retrying with web client..."
            yt-dlp --no-warnings --extractor-args 'youtube:player_client=web' --dump-single-json --skip-download "$URL" > test-output/metadata-retry.json 2> test-output/yt-dlp-retry.log
            RC2=$?
            if [ "$RC2" -eq 0 ] && python3 -m json.tool test-output/metadata-retry.json >/dev/null 2>&1; then
              cp test-output/metadata-retry.json test-output/metadata.json
              RC=0
            fi
          fi

          if [ "$RC" -ne 0 ] || ! python3 -m json.tool test-output/metadata.json >/dev/null 2>&1; then
            echo "status=unknown" >> "$GITHUB_OUTPUT"
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "reason=yt-dlp could not obtain valid metadata after two attempts" >> "$GITHUB_OUTPUT"
            echo "STATUS=UNKNOWN (extraction/metadata failure)"
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('test-output/metadata.json', encoding='utf-8'))
          status=d.get('live_status') or ('is_live' if d.get('is_live') else 'not_live')
          title=str(d.get('title','')).replace('\n',' ')
          print('status=' + status)
          print('live=' + ('true' if status == 'is_live' or d.get('is_live') is True else 'false'))
          print('title=' + title[:180])
          print('live_status=' + status)
          PY

          echo "yt-dlp live_status: $(grep '^live_status=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

      - name: Stop cleanly when source is offline
        if: steps.live.outputs.status == 'not_live' || steps.live.outputs.status == 'was_live' || steps.live.outputs.status == 'post_live' || steps.live.outputs.status == 'is_upcoming'
        run: |
          echo "Crispulo Reporter is not currently LIVE."
          echo "yt-dlp status: ${{ steps.live.outputs.status }}"

      - name: Stop cleanly on detection error
        if: steps.live.outputs.status == 'unknown'
        run: |
          echo "Crispulo Reporter status is UNKNOWN."
          echo "This is NOT being classified as OFFLINE."
          echo "Reason: ${{ steps.live.outputs.reason }}"

      - name: Resolve direct media URL
        if: steps.live.outputs.live == 'true'
        id: media
        shell: bash
        run: |
          URL="https://www.youtube.com/watch?v=${{ steps.config.outputs.video_id }}"
          set -o pipefail
          yt-dlp --no-warnings --get-url -f 'best[protocol^=http][height<=720]/best' "$URL" > test-output/media_url.txt 2> test-output/media-url.log
          if [ ! -s test-output/media_url.txt ]; then
            echo "Normal media URL resolution failed; retrying with web client..."
            yt-dlp --no-warnings --extractor-args 'youtube:player_client=web' --get-url -f 'best[height<=720]/best' "$URL" > test-output/media_url_retry.txt 2> test-output/media-url-retry.log
            if [ -s test-output/media_url_retry.txt ]; then
              cp test-output/media_url_retry.txt test-output/media_url.txt
            fi
          fi
          test -s test-output/media_url.txt
          echo "Direct media URL resolved successfully."

      - name: Generate short HLS test
        if: steps.live.outputs.live == 'true'
        shell: bash
        run: |
          mkdir -p test-output/hls
          set +e
          timeout 75s ffmpeg -hide_banner -loglevel warning \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$(head -n1 test-output/media_url.txt)" \
            -map 0:v:0 -map 0:a:0? \
            -c:v copy -c:a aac -b:a 128k \
            -f hls -hls_time 4 -hls_list_size 6 -hls_flags delete_segments+append_list \
            test-output/hls/index.m3u8 > test-output/ffmpeg.log 2>&1
          FFMPEG_RC=$?

          if [ -s test-output/hls/index.m3u8 ]; then
            echo "HLS playlist generated successfully."
            ls -lh test-output/hls
          else
            echo "FFmpeg did not produce an HLS playlist."
            cat test-output/ffmpeg.log || true
            exit "$FFMPEG_RC"
          fi

      - name: Create test report
        if: always()
        shell: bash
        run: |
          {
            echo '# Crispulo Reporter — automated test'
            echo
            echo "- Checked at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Video ID: ${{ steps.config.outputs.video_id }}"
            echo "- Detection status: ${{ steps.live.outputs.status || 'not evaluated' }}"
            echo "- LIVE detected: ${{ steps.live.outputs.live || 'false' }}"
            echo "- Title: ${{ steps.live.outputs.title || 'N/A' }}"
            echo "- Reason: ${{ steps.live.outputs.reason || 'N/A' }}"
            if [ -s test-output/hls/index.m3u8 ]; then
              echo '- HLS generation: SUCCESS'
              echo '- Playlist: test-output/hls/index.m3u8'
            elif [ "${{ steps.live.outputs.status }}" = "unknown" ]; then
              echo '- HLS generation: NOT RUN (detection error)'
            elif [ "${{ steps.live.outputs.live }}" = "true" ]; then
              echo '- HLS generation: FAILED'
            else
              echo '- HLS generation: NOT RUN (source not live)'
            fi
          } > test-output/report.md

      - name: Upload live HLS test artifact
        if: steps.live.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crispulo-hls-test-${{ github.run_number }}
          path: test-output/
          retention-days: 2

      - name: Upload diagnostic artifact
        if: always() && steps.live.outputs.live != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crispulo-diagnostic-${{ github.run_number }}
          path: test-output/
          retention-days: 2
